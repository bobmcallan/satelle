# agents.toml — the agents layer: how each agent runs (backend + tool grant).
# The `command` field is a SINGLE-token PRESET (claude | grok | codex | in-loop)
# or a full command template with {system}/{tools}/{model}/{payload} placeholders
# (each one argv token; payload also on stdin — dual delivery), OR with
# interface = "acp" a spawn line only (no placeholders — system/payload ride the
# protocol). `harness` is the deprecated alias, still parsed. See
# `satelle help agent-dispatch`.
#
# role = "reviewer" | "agent" declares the binding's contract (epic:agent-invoke-unify):
#   reviewer → isolated verdict {decision, notes, reasoning}
#   agent    → performer (in-loop or sub-process)
# principles = session|all|system|project|none (or comma-list) declares injected context.
#
# Topology (must match active DOTs — sty_b9ecd5d2):
#   [executor]  — in-loop for project in_progress / integration / release and
#                 substrate in_progress (agent=executor on those nodes).
#   [reviewer]  — every agent=reviewer gate edge (intent, plan-review, code-ac, …).
#   [planner]   — project workflow plan node only (agent=planner).
#   [retrospective] — project done on_enter_agent (lessons).
#   [blocked-triage] — blocked on_enter_agent (non-engaging park).
#   [coder]     — DORMANT: no workflow node allocates agent=coder (sty_db003275);
#                 kept for tests/re-opt-in only.
# model stays non-empty (TestRepoReviewerModelIsActive).
# Per-gate model without a second binding: a workflow edge/node may set model="…"
# to override only the model for that gate/step while keeping the shared harness
# (sty_19456622). See satelle help agent-dispatch and satelle-dot-standard.

[executor]
role    = "agent"
command = "in-loop"
principles = "session"

# Full command template, not the bare "grok" preset — the reviewer's grant must be
# VISIBLE (transparency, sty_892517e7): the read-only --tools grant and the --deny
# mutator ceiling are spelled out here, so it is clear what the reviewer can and
# cannot do without knowing what a preset expands to. (command = "grok" resolves to
# this exact argv; the preset is for a from-scratch wiring, not the committed default.)
[reviewer]
role    = "reviewer"
command = "grok -p {payload} --system-prompt-override {system} --tools read_file,grep,list_dir -m {model} --deny Write --deny Edit --deny search_replace --deny write --always-approve --output-format plain --max-turns 16 --no-subagents"
tools   = "read_file,grep,list_dir"   # grok-native read-only grant (the preset bakes this; shown here so the ceiling is explicit)
model   = "grok-4.5"
principles = "session"

[planner]
role    = "agent"
command = "claude -p --output-format json --disallowedTools Write,Edit,NotebookEdit --append-system-prompt {system} --allowedTools {tools} --model {model}"
tools   = "Read,Grep,Glob,Bash(satelle:*)"
model   = "opus"
principles = "session"

[retrospective]
role    = "agent"
command = "claude -p --output-format json --append-system-prompt {system} --allowedTools {tools} --model {model}"
tools   = "Read,Grep,Glob,Bash(satelle:*)"
model   = "sonnet"
principles = "session"

# blocked-triage — performing diagnosis/unblock on park entry (epic:blocked-reasoning-agent).
# Wired via on_enter_agent=blocked-triage on the blocked node (agent=reviewer stays the
# engagement role so the park remains non-engaging — sty_5cabe26f). Reuse check: [executor]
# is in-loop only; [planner]/[reviewer] are read-only. Full tools — gates bound authority,
# not --deny. Model: most capable available (opus).
[blocked-triage]
role    = "agent"
command = "claude -p --output-format json --append-system-prompt {system} --allowedTools {tools} --model {model}"
tools   = "Read,Write,Edit,Grep,Glob,Bash"
model   = "opus"
principles = "session"

# not wired in any current workflow — dispatched-coder (epic:dispatched-coder)
# superseded by in-loop executor. Kept dormant for tests/re-opt-in (sty_db003275);
# no workflow node allocates agent=coder. When re-wired: Grok argv-first,
# edit-capable via search_replace only (no run_terminal_command / write —
# headless Grok agent-build refuses both). Context via payload `docs`
# (sty_58fa970e); plan-consumed evidence is a stdout statement.
# --always-approve: .grok PreToolUse gates are the real ceiling.
[coder]
role    = "agent"
command = "grok -p {payload} --system-prompt-override {system} --tools read_file,grep,list_dir,search_replace -m {model} --always-approve --output-format plain --max-turns 40 --no-subagents"
tools   = "read_file,grep,list_dir,search_replace"
model   = "grok-4.5"
principles = "session"
