# agents.toml — the agents layer: how each agent runs (backend + tool grant).
# The `command` field is a SINGLE-token PRESET (claude | grok | codex | in-loop)
# or a full command template with {system}/{tools}/{model}/{payload} placeholders
# (each one argv token; payload also on stdin — dual delivery). `harness` is the
# deprecated alias, still parsed. See `satelle help agent-dispatch`.
#
# role = "reviewer" | "agent" declares the binding's contract (epic:agent-invoke-unify):
#   reviewer → isolated verdict {decision, notes, reasoning}
#   agent    → performer (in-loop or sub-process)
# principles = session|all|system|project|none (or comma-list) declares injected context.
#
# Reviewer: Grok, argv-first ({payload} on -p + stdin) — the FULL command so the
# read-only grant (--tools read_file,grep,list_dir) and mutator ceiling (--deny …)
# are visible rather than hidden behind the `grok` preset token.
# Planner/retrospective: Claude stdin-first (no {payload} — not double-fed) so
# Bash(satelle:*) and code tools work. Grok Build currently cannot enable
# run_terminal_command (agent-build constraint), so Grok is not used for
# shell-needing dispatch steps.
# model stays non-empty (TestRepoReviewerModelIsActive).

[executor]
role    = "agent"
command = "in-loop"
principles = "session"

# Full command template, not the bare "grok" preset — the reviewer's grant must be
# VISIBLE (transparency, sty_892517e7): the read-only --tools grant and the --deny
# mutator ceiling are spelled out here, so it is clear what the reviewer can and
# cannot do without knowing what a preset expands to. (command = "grok" resolves to
# this exact argv; the preset is for a from-scratch wiring, not the committed default.)
[reviewer]
role    = "reviewer"
command = "grok -p {payload} --system-prompt-override {system} --tools read_file,grep,list_dir -m {model} --deny Write --deny Edit --deny search_replace --deny write --always-approve --output-format plain --max-turns 16 --no-subagents"
tools   = "read_file,grep,list_dir"   # grok-native read-only grant (the preset bakes this; shown here so the ceiling is explicit)
model   = "grok-4.5"
principles = "session"

[planner]
role    = "agent"
command = "claude -p --output-format json --disallowedTools Write,Edit,NotebookEdit --append-system-prompt {system} --allowedTools {tools} --model {model}"
tools   = "Read,Grep,Glob,Bash(satelle:*)"
model   = "opus"
principles = "session"

[retrospective]
role    = "agent"
command = "claude -p --output-format json --append-system-prompt {system} --allowedTools {tools} --model {model}"
tools   = "Read,Grep,Glob,Bash(satelle:*)"
model   = "sonnet"
principles = "session"
