# agents.toml — Grok-native bindings (dual payload: {payload} on -p + stdin).
# Reviewer/planner use plain output so gate verdicts parse; max-turns high enough
# for tool-using gates. Bash(satelle:*) stays in tools for satelle's pull-context
# grant check (DispatchExecutor); Grok native tool ids drive the CLI.
# model stays non-empty (TestRepoReviewerModelIsActive).

[executor]
harness = "in-loop"

[reviewer]
harness = "grok -p {payload} --system-prompt-override {system} --tools {tools} -m {model} --deny Write --deny Edit --deny search_replace --deny write --always-approve --output-format plain --max-turns 12 --no-subagents"
tools   = "read_file,grep,list_dir"
model   = "grok-4.5"

[planner]
harness = "grok -p {payload} --system-prompt-override {system} --tools {tools} -m {model} --always-approve --output-format plain --max-turns 16 --no-subagents"
tools   = "read_file,grep,list_dir,run_terminal_command,Bash(satelle:*)"
model   = "grok-4.5"

[worker]
harness = "grok -p {payload} --system-prompt-override {system} --tools {tools} -m {model} --always-approve --output-format plain --max-turns 24 --no-subagents"
tools   = "read_file,grep,list_dir,search_replace,write,run_terminal_command,Bash(satelle:*)"
model   = "grok-4.5"
timeout = "45m"

[retrospective]
harness = "grok -p {payload} --system-prompt-override {system} --tools {tools} -m {model} --always-approve --output-format plain --max-turns 16 --no-subagents"
tools   = "read_file,grep,list_dir,run_terminal_command,Bash(satelle:*)"
model   = "grok-4.5"
