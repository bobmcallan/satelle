# agents.toml — the agents layer: how each agent runs (backend + tool grant).
# The `command` field is a SINGLE-token PRESET (claude | grok | codex | in-loop)
# or a full command template with {system}/{tools}/{model}/{payload} placeholders
# (each one argv token; payload also on stdin — dual delivery), OR with
# interface = "acp" a spawn line only (no placeholders — system/payload ride the
# protocol). `harness` is the deprecated alias, still parsed. See
# `satelle help agent-dispatch`.
#
# role = "reviewer" | "agent" declares the binding's contract (epic:agent-invoke-unify):
#   reviewer → isolated verdict {decision, notes, reasoning}
#   agent    → performer (in-loop or sub-process)
# principles = session|all|system|project|none (or comma-list) declares injected context.
#
# Topology (must match active DOTs — sty_b9ecd5d2):
#   [executor]  — in-loop for project in_progress / integration / release and
#                 substrate in_progress (agent=executor on those nodes).
#   [reviewer]  — every agent=reviewer gate edge (intent, plan-review, code-ac, …).
#   [planner]   — project workflow plan node only (agent=planner).
#   [retrospective] — project done on_enter_agent (lessons).
#   [blocked-triage] — blocked on_enter_agent (non-engaging park).
#   [coder]     — DORMANT: no workflow node allocates agent=coder (sty_db003275);
#                 kept for tests/re-opt-in only.
# model stays non-empty (TestRepoReviewerModelIsActive).
# Per-gate model without a second binding: a workflow edge/node may set model="…"
# to override only the model for that gate/step while keeping the shared harness
# (sty_19456622). See satelle help agent-dispatch and satelle-dot-standard.
#
# 2026-07-20: all isolated agents on Grok ACP (claude rate-limited on this host).
# executor stays in-loop (driving session). Revert planner/retrospective/
# blocked-triage to claude command templates when rate limits lift.

[executor]
role    = "agent"
command = "in-loop"
principles = "session"

# [reviewer] — Grok over ACP (sty_ce84ea63 / epic:agent-dispatch-transport).
# Spawn is "grok agent stdio" only: system + payload ride protocol content blocks;
# model is set via session set_config_option (failure-tolerant). Placeholders are
# REJECTED on interface=acp commands.
#
# Read-only ceiling: formerly sty_892517e7 made the argv-template grant visible
# (--tools read_file,grep,list_dir plus --deny Write/Edit/…). Under ACP that
# rationale is superseded — the ceiling is enforced BY SATELLE at the protocol
# seam (session/request_permission auto-denies mutators when the grant has no
# write-capable tool; toolsAllowMutators). Protocol enforcement is stronger than
# trusting CLI --deny flags. tools= still names the grant satelle advertises.
[reviewer]
role      = "reviewer"
interface = "acp"
command   = "grok agent stdio"
tools     = "read_file,grep,list_dir"
model     = "grok-4.5"
principles = "session"

# Planner — plans only (no implement). Grok ACP; context via read_file channel.
[planner]
role      = "agent"
interface = "acp"
command   = "grok agent stdio"
tools     = "read_file,grep,list_dir"
model     = "grok-4.5"
principles = "session"

# Retrospective — lessons on enter-done. Read-only grant; satelle via CLI when
# shell available, otherwise payload/docs (sty_58fa970e).
[retrospective]
role      = "agent"
interface = "acp"
command   = "grok agent stdio"
tools     = "read_file,grep,list_dir"
model     = "grok-4.5"
principles = "session"

# blocked-triage — performing diagnosis/unblock on park entry (epic:blocked-reasoning-agent).
# Wired via on_enter_agent=blocked-triage on the blocked node (agent=reviewer stays the
# engagement role so the park remains non-engaging — sty_5cabe26f). Mutators allowed
# so triage can file notes/attachments; gates still bound authority.
[blocked-triage]
role      = "agent"
interface = "acp"
command   = "grok agent stdio"
tools     = "read_file,grep,list_dir,search_replace"
model     = "grok-4.5"
principles = "session"

# not wired in any current workflow — dispatched-coder (epic:dispatched-coder)
# superseded by in-loop executor. Kept dormant for tests/re-opt-in (sty_db003275);
# no workflow node allocates agent=coder. When re-wired: Grok ACP (sty_ce84ea63)
# with search_replace in the grant (mutators allowed via toolsAllowMutators).
# Context via payload `docs` (sty_58fa970e); plan-consumed evidence is a stdout statement.
[coder]
role      = "agent"
interface = "acp"
command   = "grok agent stdio"
tools     = "read_file,grep,list_dir,search_replace"
model     = "grok-4.5"
principles = "session"
