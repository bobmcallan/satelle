# satelle.toml — per-repo config (committed, secret-free). Every setting has a
# default, so this file may stay fully commented; uncomment a key to override.
# Per-user overrides go in satelle.local.toml beside this file (gitignored).

# data_dir = ".satelle"          # home for the per-repo database (default)
# db = ".satelle/satelle.db"     # database path (default: <data_dir>/satelle.db)
# web_port = 8787                # 'satelle serve' listen port (default)
# log_level = "info"             # debug | info | warn | error (default info)

# substrate_roots — per-kind parent dir for authored markdown. Unset means
# <data_dir>/<kind> (e.g. .satelle/documents). Point a kind elsewhere — even
# outside .satelle/ — to author it at the repo root or another path:
# [substrate_roots]
# documents = "."                # → ./documents
# skills = "."                   # → ./skills

[review]
# Create gate ON (channel-alignment sty_83782ffb): structure + content/alignment
# + classification (satelle-story-create-review) on every story/task create.
# Misclassification is cheapest to catch at create. Set false to opt out.
gate_create = true

# [tags.vocabulary] — controlled tag namespaces (sty_034d843c / epic:surface-scoped-steps).
# A tag in a listed namespace must use a declared value (matched case-insensitively;
# stored in the casing declared here). Namespaces absent from the table stay free-form
# (area:, epic:, order:, …). Repo-specific: another repo declares its own surfaces.
[tags.vocabulary]
surface = ["ui", "cli"]

[gate]
# Repo-root-relative path prefixes whose edits are EXEMPT from the engaged-story
# edit gate. This is the SOLE exemption source — exemption is configuration, not a
# Go rule (the constitution: configuration over code); the binary does NOT
# special-case the data dir (sty_8c3d345c). ".satelle/" keeps this repo's authored
# substrate (workflows/skills/principles/documents/tasks/config) editable without a
# release. Add ".claude/" here to author Claude Code skills without an engaged story.
edit_exempt_paths = [".satelle/", ".claude/"]

# [gate.command_allow] — OPT-IN step-scoped Bash policy (sty_c21490cc). Keys are
# git subcommands; values are story statuses that may run them while engaged.
# Empty/absent = no step restriction (commitgate only requires SOME engagement).
# Example (push only at release):
#   [gate.command_allow]
#   push = ["release"]

[hosted]
server = "https://satelle.dev"
project = "satelle"
# Active team workspace is per-developer (satelle.local.toml / satelle login
# --workspace); unset means the personal workspace default.

# [sync] — each .satelle area on the local|personal|shared ladder
# (epic:scoped-sync / epic:sync-publish). Unset = local (writes nothing hosted).
# personal = this repo's bound hosted project only — not a shared dump across
# every project under your personal workspace. Bind with:
#   satelle project bind <slug>
# (or set [hosted] project above). shared:true / shared scope no longer routes
# sync to a team workspace; use `satelle publish` for the team catalog.
# Inspect with `satelle sync scopes`. Per-kind commands:
#   satelle sync config push|deploy
#   satelle sync documents push|pull
#   satelle sync workstate push
# Areas: documents, workflows, principles, skills, constitution, agents, tasks,
# stories, ledger, executions.
# The reserved key `all` blanket-defaults every area not set explicitly, so one
# line opts the whole tree in; a per-area key still overrides it.
[sync]
all = "personal"               # every area personal unless overridden below
# skills = "shared"
# documents = "personal"
# stories = "personal"
