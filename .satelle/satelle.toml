# satelle.toml — per-repo config (committed, secret-free). Every setting has a
# default, so this file may stay fully commented; uncomment a key to override.
# Per-user overrides go in satelle.local.toml beside this file (gitignored).

# data_dir = ".satelle"          # home for the per-repo database (default)
# db = ".satelle/satelle.db"     # database path (default: <data_dir>/satelle.db)
# web_port = 8787                # 'satelle serve' listen port (default)
# log_level = "info"             # debug | info | warn | error (default info)

# substrate_roots — per-kind parent dir for authored markdown. Unset means
# <data_dir>/<kind> (e.g. .satelle/documents). Point a kind elsewhere — even
# outside .satelle/ — to author it at the repo root or another path:
# [substrate_roots]
# documents = "."                # → ./documents
# skills = "."                   # → ./skills

[review]
# Run the required-structure reviewer on every story/task creation, so a work
# item's structure is ALWAYS validated by an isolated reviewer before it persists.
gate_create = false

[gate]
# Repo-root-relative path prefixes whose edits are EXEMPT from the engaged-story
# edit gate, in addition to the always-exempt data dir (.satelle/). A harness
# authoring dir holds authored markdown (skills, prompts), not product code, so it
# is edited freely like substrate. This repo authors Claude Code skills under
# .claude/. Default is empty — the binary stays CLI-vendor-neutral.
edit_exempt_paths = []

[hosted]
server = "https://satelle.dev"
project = "satelle"
# Active team workspace is per-developer (satelle.local.toml / satelle login
# --workspace); unset means the personal workspace default.

# [sync] — each .satelle area on the local|personal|shared ladder
# (epic:scoped-sync). Unset = local. satelle.local.toml overrides per area.
# Inside a personal area, frontmatter `shared: true` promotes a file to the
# team workspace. Inspect with `satelle sync scopes`. Per-kind commands:
#   satelle sync config push|deploy
#   satelle sync documents push|pull
#   satelle sync workstate push
# Areas: documents, workflows, principles, skills, constitution, agents, tasks,
# stories, ledger, executions.
# [sync]
# skills = "shared"
# documents = "personal"
# stories = "personal"
