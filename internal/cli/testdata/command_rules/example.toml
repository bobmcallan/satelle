# Example rule set for tests only. satelle ships no rule and no default list:
# every rule is authored by the repo, and this file is never read outside tests.
#
# It separates a fictional CLI's read-only subcommands (get, list, describe:
# no rule names them, so they pass in every status) from its mutating ones
# (apply, delete: denied unless the story is engaged at in_progress; scale: a
# warning that runs the command).

[[gate.command_rule]]
pattern = "orbctl apply"
action = "deny"
allow = ["in_progress"]
message = "orbctl apply changes shared state"

[[gate.command_rule]]
pattern = "orbctl delete"
action = "deny"
allow = ["in_progress"]
message = "orbctl delete removes shared state"

[[gate.command_rule]]
pattern = "orbctl scale *"
action = "warn"
message = "orbctl scale changes capacity"
