[meta]
name = "done"
type = "workflow"
scope = "system"
tags = ["type:workflow"]
create_review = "satelle-story-create-review"
amend_review = "satelle-story-amend-review"
description = "Order-zero declaration of done every repo inherits — one table per story category, listing the obligations discharged before work closes, plus the park and cancel states the binary synthesises. Half of a derived route; step.toml is the other half. Selected by category name; `*` governs the rest."

# Order zero: one working lane, plus containers and task runs. A repo edits this
# file rather than authoring a lifecycle from scratch — add obligations, add
# categories, and step.toml says what discharges them.
#
# A table is KEYED BY THE CATEGORY it governs. An obligation is a plain word
# ("coded") and links to a step by that step's KEY in step.toml, which is the
# obligation itself.
#
# ORDER is derived, not authored: the binary topologically sorts the selected
# steps by their `requires`. The order here is for the reader. A category selects
# only the steps whose key it names, so a short list is a short route — that is
# how a category opts out of work it does not need.
#
# A table selects the lane at EVERY transition, so adding or altering one
# RE-LANES work already in flight under that category. A story that walked a step
# the new lane does not declare is refused with `route-drift`, naming both lanes;
# reclassify while the story is still in its entry state (category freezes after
# that), or re-raise the work carrying `supersedes:<id>`. Name
# satelle-route-drift-check on a step to have a gate judge the softer case, where
# the history is off-lane but movement is still legal.
#
# Topology is synthesised too — park and cancel from every non-terminal step, and
# the backward edges for recover — so nothing below draws them by hand.
#
# The two `[meta]` hooks above — create_review and amend_review — are LIFECYCLE
# hooks: they fire outside the status graph, so they are declared ONCE for the
# whole workflow rather than per category the way park and cancel are. amend_review
# judges `satelle story amend`, the only way a story's frozen definition fields
# (title, body, acceptance criteria, category) can change after it leaves its entry
# state. Delete the line and there is no amend path at all — with nothing to judge
# the correction the freeze holds, and cancel-and-re-raise is the only exit. That
# is a choice made by editing this file; the JUDGEMENT itself lives in the skill
# the line names, never in the binary.

# ================================================================
# THE WORKING LANE — governs every category with no table of its own
# raised -> coded -> closed
# ================================================================

# Quoted because `*` is not a bare TOML key. It is the same wildcard token a
# gate's `for` list uses, deliberately: one spelling for one idea.
["*"]
# The default shape for work: it is raised, it is done, it is closed. Add
# obligations here (and a step providing each in step.toml) to grow the lane —
# a plan step, a review step, a release step — rather than authoring a second
# lifecycle beside it.
obligations = ["raised", "coded", "closed"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }

# ================================================================
# THE DOCS LANE — a slice whose whole surface is prose
# raised -> authored -> docs-verified
# ================================================================

[docs]
# Documentation is AUTHORED, not coded, and its close asks one proportionate
# question — did the change set stay inside doc-typed paths? — instead of the
# working lane's code-shaped review. Same park and cancel as `*`: a doc slice
# blocks and is abandoned like any other work.
#
# COMPOSITION: authored substrate overrides the embedded default per FILE, so a
# repo carrying its own done.toml does NOT inherit this table — it adopts the
# lane by copying this table into that file and the two steps into its
# step.toml. A repo with no done.toml of its own gets the lane as shipped.
obligations = ["raised", "authored", "docs-verified"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }

# ================================================================
# CONTAINERS — closed by their children, not by work of their own
# raised -> children-resolved
# ================================================================

[epic-parent]
# A container holds other items; nothing is performed on it, which is why it has
# two obligations and no working lane. `children-resolved` is discharged by the
# step of that name in step.toml, whose gate is handed a snapshot of the children
# to judge from.
#
# DECISION, not omission: no park. Nothing performs in a container, so there is
# no work to block — a stuck container is a fact about its children, and each of
# them can park on its own.
obligations = ["raised", "children-resolved"]
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }

[parent]
# The same shape one level down, and deliberately its own table rather than a
# shared one: a category is selected by exact name before `*` is consulted, so
# both container kinds must name themselves. Same no-park decision applies.
obligations = ["raised", "children-resolved"]
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }

# ================================================================
# TASK RUNS — an action, then its verification
# raised -> run -> run-verified
# ================================================================

[execution]
# A run, not a piece of work: something is executed and then checked. Both
# obligations are discharged by steps gated with the task-validate reviewers —
# one on entry to the run, one on entry to its close.
#
# DECISION, not omission: no park, and cancel names no gate. A run that should
# stop simply stops; there is no slice of work to preserve, and nothing for a
# reviewer to judge on the way out.
obligations = ["raised", "run", "run-verified"]
cancel = { state = "cancelled" }

[task]
# Same shape as execution, kept separate so both kinds resolve by exact name
# rather than one of them falling through to `*` — which would put a run on the
# working lane and gate it as though it were work.
obligations = ["raised", "run", "run-verified"]
cancel = { state = "cancelled" }
