[meta]
name = "step"
type = "workflow"
scope = "system"
tags = ["type:workflow"]
description = "Order-zero step catalogue every repo inherits — the steps and always-on gates a route selects from by obligation. A step is keyed by the obligation it discharges and declares the status an item holds there, what it requires, who performs it and the reviewers gating ENTRY to it. Half of a derived route; done.toml is the other half."

# A step table is KEYED BY THE OBLIGATION it discharges — that is the step's
# identity, and done.toml selects steps by naming those keys.
#
# `status` is the STAGE NAME: the status an item holds while in this step. It is
# a field and not the key because stage names REPEAT — `done` is three different
# steps below, one per route family, because different routes reach the same
# status by discharging different obligations. Obligations do not repeat.
#
# The catalogue is SHARED. A step here runs only for the categories whose
# done.toml table names its key, so adding a step does not put it on any route
# until an obligation asks for it.
#
# A step carries no executor rubric: the binary ships no opinion about how work
# is done. A repo names one with `skills` when it authors one.

# ================================================================
# THE WORKING LANE — selected by done.toml category "*"
# raised -> coded -> closed
# ================================================================

[raised]
# The entry state for EVERY category: the working lane, both container
# categories, and both task-run categories all open here.
status = "backlog"
start = true

[coded]
# Selected by "*". Carries no `skills` — the binary ships no executor rubric, so
# a repo names its own here when it authors one.
status = "in_progress"
agent = "executor"
reviewers = ["satelle-story-intent-review"]
reviewer_agent = "reviewer"
requires = ["raised"]

[closed]
# Selected by "*". Three reviewers judge entry, and `parallel = 0` is authored
# deliberately: they run SERIALLY, against the concurrent default for a
# multi-reviewer step.
status = "done"
reviewers = ["satelle-workflow-change-review", "satelle-story-scope-review", "satelle-story-done-review"]
reviewer_agent = "reviewer"
parallel = 0
terminal = true
requires = ["coded"]

# ================================================================
# THE DOCS LANE — selected by done.toml category "docs"
# raised -> authored -> docs-verified
# ================================================================

[authored]
# The same `in_progress` stage as `coded`, and deliberately a separate step:
# stage names repeat, obligations do not — authoring prose is not coding. Like
# `coded` it carries no `skills`; the binary ships no executor rubric.
status = "in_progress"
agent = "executor"
requires = ["raised"]

[docs-verified]
# The whole close: one functional check that the slice stayed inside doc-typed
# paths, which is the guard a prose slice actually needs. No `agent` — the
# check fence IS the decision, so no LLM reviewer is dispatched.
status = "done"
reviewers = ["satelle-docs-only-check"]
terminal = true
requires = ["authored"]

# ================================================================
# THE CONTAINER CLOSE — selected by "epic-parent" and "parent"
# raised -> children-resolved
# ================================================================

[children-resolved]
# Nothing performs on this lane, so `agent = "reviewer"` marks it as judging
# only; the gate is handed a snapshot of the children to judge from. It requires
# just "raised", which is why a container route is two steps long.
status = "done"
agent = "reviewer"
reviewers = ["satelle-story-done-review"]
terminal = true
requires = ["raised"]

# ================================================================
# THE TASK RUN — selected by "execution" and "task"
# raised -> run -> run-verified
# ================================================================

[run]
# Its gate validates the run BEFORE it begins.
status = "in_progress"
agent = "executor"
reviewers = ["satelle-task-validate-before-review"]
reviewer_agent = "reviewer"
requires = ["raised"]

[run-verified]
# Its gate validates the run AFTER it has happened, which is what makes a run
# verified rather than merely finished.
status = "done"
reviewers = ["satelle-task-validate-after-review"]
reviewer_agent = "reviewer"
terminal = true
requires = ["run"]

# ================================================================
# ALWAYS-ON GATES
#
# A gate occupies no stage; it fires on entry to steps. It stays an ARRAY rather
# than a keyed table, and that is not an inconsistency with the steps above: the
# same SKILL legitimately appears more than once under different scope, so a gate
# has no unique identity to key on.
#
# Its three scoping keys are different axes, and confusing them is the usual
# authoring mistake:
#
#   on          which STEPS it fires on ("*" = every step), by their status
#   for         which done.toml CATEGORIES it belongs to. `for = ["*"]` means the
#               WILDCARD category — the working lane — not "everything".
#               A gate with no `for` belongs to every route.
#   applies_to  which ITEMS, by tag.
# ================================================================

[[gate]]
# Summarises transitions on the working lane and both container lanes.
#
# DECISION, not omission: `for` does not name the task-run categories, so a run
# gets no step summary — its own before/after validators are the record.
skill = "satelle-step-summary"
agent = "reviewer"
mandatory = true
for = ["*", "docs", "epic-parent", "parent"]

[[gate]]
# Fences the estimate on entry to in_progress and the actual on entry to done.
#
# DECISION, not omission: `for = ["*"]` only. Containers perform no work to
# estimate, a run is not estimated, and a docs slice is not worth fencing —
# estimating a prose change costs more than the estimate is worth.
skill = "satelle-estimate-actual-review"
on = ["in_progress", "done"]
for = ["*"]
