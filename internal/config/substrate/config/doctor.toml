# `satelle doctor` tuning. A repo overrides a value in satelle.toml under the same
# [doctor] table.
#
# duplicate_min_words is the shortest run of consecutive words (case, whitespace
# and markdown punctuation ignored) that doctor reports as VERBATIM duplicated
# guidance when it appears in two documents. It is a threshold, not a verdict:
# short shared phrases ("see the constitution") are ordinary prose, while a run
# this long is one passage copied into a second place instead of pointed at.
# Paraphrase is not word-for-word and is the opt-in `doctor --context-review`
# semantic pass, not this check.
[doctor]
duplicate_min_words = 14
