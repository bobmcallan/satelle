# Baseline agent SEATS (sty_6602bb44). Seat identity only: each seat names its
# role and principles, never a vendor command, tools grant or model — those come
# from a profile= the seat names, from the catalog's [roles] when the repo sets
# use_global_roles, or from the embedded fallback. A repo's .satelle/workflows/agents.toml names only the
# seats it points at a different profile or setting; every seat it does not name
# stays exactly as written here.

[executor]
role       = "agent"
command    = "in-loop"
principles = "session"

[reviewer]
role       = "reviewer"
principles = "session"

[planner]
role       = "agent"
principles = "session"

[coder]
role       = "agent"
principles = "session"

[orchestrator]
role       = "agent"
principles = "session"

[ready-reviewer]
role       = "agent"
principles = "session"

[reviewer-consult]
role       = "reviewer"
principles = "session"

[reviewer-summary]
role       = "reviewer"
principles = "session"

[retrospective]
role       = "agent"
principles = "session"

[blocked-triage]
role       = "agent"
principles = "session"
