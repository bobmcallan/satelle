# In-loop fix lane — the embedded DEFAULT bound (sty_4b694872). A repo layers its
# own [fix_lane] table in satelle.toml on top; this file is the single source of
# the bytes, so no bound figure lives in Go.
#
# The lane lets a driver record a typed in-loop-fix claim and make one small,
# self-evident edit without a full engage. The BOUND is what stops that premise
# being an excuse:
#
#   max_lines        — the largest size bound a claim may declare, in changed
#                      lines. A repo raises or lowers it in its own [fix_lane].
#                      A repo that sets no bound falls to THIS value, never to
#                      "anything goes".
#   gate_skills, reviewer_rubrics, workflows, principles, repo_config
#                    — the path classes the lane can never touch. They are NOT
#                      spelled here: satelle DERIVES them from where this repo
#                      keeps its substrate (data_dir, [substrate_roots]), so a
#                      repo that relocates its substrate keeps every refusal.
#                        gate_skills      the skills root
#                        workflows        the workflows root
#                        principles       the principles root + the constitution
#                        reviewer_rubrics the agents layer that binds a reviewer's
#                                         rubric and grant (workflows/agents.toml
#                                         and its workspace/legacy siblings)
#                        repo_config      satelle.toml / satelle.local.toml, which
#                                         carry this very bound
#                      A repo's own lists in [fix_lane] ADD to the derived ones —
#                      a repo can widen a refused class, never narrow it. The
#                      lists below are the embedded additions: none.
#   product_surface  — deliberately EMPTY here. Which paths are product is the
#                      repo's own opinion (the binary ships none of its own). A
#                      repo declaring none has NO fix lane: every claim is
#                      refused (class "undeclared-bound"), because a lane with no
#                      declared product surface would be anything-goes by default.
[fix_lane]
max_lines = 20
product_surface = []
gate_skills = []
reviewer_rubrics = []
workflows = []
principles = []
repo_config = []
