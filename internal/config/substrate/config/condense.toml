# How a resident document is condensed when the context it rides in has a size
# budget (sty_df21b2db). The authored file is never touched: the condenser works
# on the text it is about to deliver, and keeps the exact original behind a
# `satelle retrieve` marker, so an author writes prose at any length and the fit
# happens when the context is assembled.
#
# A repo overrides any key in .satelle/config/condense.toml; a key it leaves out
# keeps this default. Go recognises only markdown structure (code fences, inline
# code, headings, [[links]], list items); every word-level decision is below.
#
# ladder — the rungs a body is stepped down, in order, until the context fits.
#   full     the authored body, as written
#   filler   the same body with the drop_phrases removed
#   lead     headings and code, the first sentence of each paragraph and list
#            item, and every clause that holds a protected token
#   pointer  a one-line read instruction; the last resort, never used while a
#            condensed body would still fit
# A rung that would not make a body smaller is skipped for that body.
ladder = ["full", "filler", "lead", "pointer"]

# drop_phrases — filler that carries no rule. Matched case-insensitively on word
# boundaries, outside inline code, links and protected tokens.
drop_phrases = [
  "really", "very", "simply", "just", "basically", "actually", "essentially",
  "in order", "please", "of course", "note that", "it is worth noting that",
  "generally", "typically", "usually", "quite", "rather", "somewhat",
  "the", "a", "an",
]

# protected_patterns — regular expressions (RE2). A clause holding a match is
# never dropped from the lead rung, and a match is never edited by the filler
# rung. These are the shapes that turn a sentence into a rule: negations,
# numbers, paths and satelle commands.
protected_patterns = [
  '(?i)\b(?:not|never|no|cannot|without)\b',
  "(?i)\\b\\w+n['’]t\\b",
  '\d+',
  '(?:[A-Za-z0-9_.-]+/)+[A-Za-z0-9_.*-]+',
  '\bsatelle\s+[a-z][a-z-]*(?:\s+[a-z<][\w<>=.:-]*)*',
]

# clause_delimiters — where a sentence is cut into clauses for the lead rung.
clause_delimiters = [";", ": ", " — ", " - ", " – "]

# sentence_terminators — what ends a sentence when followed by white space.
sentence_terminators = [".", "?", "!"]

# sentence_exceptions — abbreviations whose terminator does not end a sentence.
# Matched case-insensitively against the word the terminator closes.
sentence_exceptions = ["vs.", "e.g.", "i.e.", "etc.", "cf.", "approx.", "incl."]
