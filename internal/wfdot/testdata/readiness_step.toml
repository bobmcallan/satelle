[meta]
name = "step"
type = "workflow"
scope = "project"
description = "The step catalogue as a repo runs the ONE-readiness-step route (sty_5262592e): a story's readiness step proposes its plan while the story is still in backlog, its reviewers judge that plan, and the definition freezes only when implementation starts. Containers keep their own ready step. This file is the fixture the route tests derive from AND the exact text a repo activates as .satelle/workflows/step.toml once its binary understands propose, freeze and reject_budget."

[raised]
status = "backlog"
start = true

# backlog → ready, CONTAINERS ONLY (sty_bb2d1542, sty_e1d93a2c; retired for
# stories by sty_5262592e). An epic-parent or parent still discharges `ready`:
# ready-reviewer running ready-review applies story configuration (order tags, a
# missing child for a stated AC, vocabulary tags); a wrong premise parks the
# container as blocked. The performer does not itself move status. A
# non-container story no longer holds this status — [readied] below is its
# readiness step.
[ready]
status = "ready"
agent = "ready-reviewer"
skills = ["ready-review"]
requires = ["raised"]

# ONE readiness step for a story (sty_5262592e), entered from backlog. Its
# performer checks the premise and produces the plan WHILE THE STORY IS STILL IN
# BACKLOG (`propose`: the performer runs before the entry gates, so the four
# reviewers judge the plan it produced). A rejected edge leaves the story in
# backlog, where title, body and acceptance criteria stay editable — every edit
# is recorded — and the driver re-presents. `reject_budget` bounds that loop: the
# 4th presentation after 3 rejected rounds is refused with the last objection
# quoted, and the orchestrator parks the story and asks the developer. The
# definition freezes at [coded], when implementation starts. The four reviewers
# run in parallel so one rejected round carries every blocking finding.
# Premise-check-and-plan is ONE skill (`plan`): a spine step carries a single
# rubric, and the read-only planner reports configuration for the driver to apply.
[readied]
status = "plan"
agent = "planner"
skills = ["plan"]
propose = true
reject_budget = 3
reviewers = [
  "satelle-story-intent-review",
  "satelle-story-plan-review",
  "satelle-story-architecture-review",
  "satelle-story-integration-coverage-review",
]
reviewer_agent = "reviewer"
parallel = 4
requires = ["raised"]

# Converge-then-gate (epic:converge-then-gate order:4, sty_ae16cd44): this repo
# allocates the implement step to the DISPATCHED [coder] binding and opts in to
# the bounded rework relay. `satelle story rework <id>` relays the coder against
# [reviewer-consult] for at most 5 rounds, stopping early on the consultant's
# READY line. That is CONSULTATION, not review: it changes no status, and the
# `reviewers` below still run cold and one-shot on the exit edge. After the
# budget without READY — or 3 rejections on this edge — the orchestrator parks
# to blocked ([[satelle-agent-consultation]] §4). The `coder` skill is the
# dispatched rubric; the in-loop `code` skill stays for repos on agent=executor.
#
# The definition FREEZES on entry here (sty_5262592e). The plan, architecture
# and coverage reviewers moved to [readied]; what remains is one deterministic
# check: the definition stays editable in `plan`, so an edit made after
# readiness was accepted would reach implementation unjudged. The check rejects
# it and names the declared way back (plan → backlog, then re-present).
[coded]
status = "in_progress"
agent = "coder"
skills = ["coder"]
freeze = true
rework = { consult = "reviewer-consult", rounds = 5 }
reviewers = ["satelle-definition-unchanged-check"]
reviewer_agent = "reviewer"
requires = ["readied"]

[integrated]
status = "integration"
agent = "executor"
skills = ["integrate"]
reviewers = [
  "satelle-ac-evidence-check",
  "satelle-retired-route-grammar-check",
  "satelle-code-ac-review",
  "satelle-story-scope-review",
  "satelle-workflow-change-review",
]
reviewer_agent = "reviewer"
parallel = 0
requires = ["coded"]

[released]
status = "release"
agent = "executor"
skills = ["release"]
reviewers = ["satelle-integration-review"]
reviewer_agent = "reviewer"
requires = ["integrated"]

[closed]
status = "done"
reviewers = ["satelle-story-release-review"]
reviewer_agent = "reviewer"
terminal = true
requires = ["released"]
advise = { agent = "retrospective", skill = "satelle-lessons" }

[children-resolved]
status = "done"
agent = "reviewer"
reviewers = ["satelle-story-done-review"]
terminal = true
requires = ["ready"]

# Docs lane (sty_a085eb50): own obligation keys so we do not share [authored]
# with substrate (that step carries skills=["substrate"]).
[doc-authored]
status = "in_progress"
agent = "executor"
requires = ["raised"]

[docs-verified]
status = "done"
reviewers = ["satelle-docs-only-check"]
terminal = true
requires = ["doc-authored"]

[authored]
status = "in_progress"
agent = "executor"
skills = ["substrate"]
requires = ["raised"]

[substrate-verified]
status = "done"
terminal = true
requires = ["authored"]

[run]
status = "in_progress"
agent = "executor"
skills = ["task-run"]
reviewers = ["satelle-task-validate-before-review"]
reviewer_agent = "reviewer"
requires = ["raised"]

[run-verified]
status = "done"
reviewers = ["satelle-task-validate-after-review"]
reviewer_agent = "reviewer"
terminal = true
requires = ["run"]

[[gate]]
skill = "satelle-step-summary"
agent = "reviewer-summary"
mandatory = true
for = ["*", "docs", "epic-parent", "parent", "substrate"]

[[gate]]
skill = "satelle-estimate-actual-review"
on = ["in_progress", "done"]
for = ["*"]

[[gate]]
skill = "satelle-format-vet-check"
on = ["integration"]
for = ["*"]

[[gate]]
skill = "satelle-build-unit-check"
on = ["integration"]
for = ["*"]

[[gate]]
skill = "satelle-integration-check"
on = ["release"]
for = ["*"]

[[gate]]
skill = "satelle-ci-published-check"
on = ["done"]
for = ["*"]

[[gate]]
skill = "satelle-dogfood-check"
on = ["done"]
for = ["*"]

[[gate]]
skill = "satelle-changelog-entry-check"
on = ["done"]
for = ["*"]

[[gate]]
skill = "satelle-design-review"
agent = "reviewer"
on = ["integration"]
applies_to = ["surface:ui"]
for = ["*"]

[[gate]]
skill = "satelle-substrate-only-check"
on = ["done"]
for = ["substrate"]

# Roster pin (sty_b8db8494): runs on substrate close only — product spine does
# not pay for a document that changes a few times a year. See skill Placement.
[[gate]]
skill = "satelle-agent-roster-check"
on = ["done"]
for = ["substrate"]
