[raised]
status = "backlog"
start = true

[planned]
status = "plan"
agent = "planner"
skills = ["plan"]
reviewers = ["satelle-story-intent-review"]
reviewer_agent = "reviewer"
requires = ["raised"]

[coded]
status = "in_progress"
agent = "executor"
skills = ["code"]
reviewers = ["satelle-story-plan-review", "satelle-story-architecture-review", "satelle-story-integration-coverage-review"]
reviewer_agent = "reviewer"
requires = ["planned"]

[integrated]
status = "integration"
agent = "executor"
skills = ["integrate"]
reviewers = ["satelle-code-ac-review", "satelle-story-scope-review", "satelle-workflow-change-review"]
reviewer_agent = "reviewer"
parallel = 0
requires = ["coded"]

[released]
status = "release"
agent = "executor"
skills = ["release"]
reviewers = ["satelle-integration-review"]
reviewer_agent = "reviewer"
requires = ["integrated"]

[closed]
status = "done"
terminal = true
reviewers = ["satelle-story-release-review"]
reviewer_agent = "reviewer"
requires = ["released"]
advise = { agent = "retrospective", skill = "satelle-lessons" }

[[gate]]
skill = "satelle-step-summary"
agent = "reviewer-summary"
mandatory = true

[[gate]]
skill = "satelle-estimate-actual-review"
on = ["in_progress", "done"]

[[gate]]
skill = "satelle-format-vet-check"
on = ["integration"]

[[gate]]
skill = "satelle-build-unit-check"
on = ["integration"]

[[gate]]
skill = "satelle-integration-check"
on = ["release"]

[[gate]]
skill = "satelle-ci-published-check"
on = ["done"]

[[gate]]
skill = "satelle-dogfood-check"
on = ["done"]

[[gate]]
skill = "satelle-changelog-entry-check"
on = ["done"]

[[gate]]
skill = "satelle-design-review"
agent = "reviewer"
on = ["integration"]
applies_to = ["surface:ui"]
