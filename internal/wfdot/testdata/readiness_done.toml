[meta]
name = "done"
type = "workflow"
scope = "project"
create_review = "satelle-story-create-review"
amend_review = "satelle-story-amend-review"
description = "The declaration of done as a repo runs the ONE-readiness-step route (sty_5262592e): a story discharges readied (backlog → plan, plan proposed before its reviewers judge it) instead of ready then planned, and a second recover entry declares plan → backlog, the way back for a definition edited after readiness was accepted. Containers keep their ready step. This file is the fixture the route tests derive from AND the exact text a repo activates as .satelle/workflows/done.toml once its binary understands the array form of recover."

["*"]
obligations = ["raised", "readied", "coded", "integrated", "released", "closed"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }
recover = [
  { step = "in_progress", from = ["integration", "release"] },
  { step = "backlog", from = ["plan"] },
]

[epic-parent]
obligations = ["raised", "ready", "children-resolved"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }

[parent]
obligations = ["raised", "ready", "children-resolved"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }

[docs]
# Prose-only product documentation. Distinct from [substrate]: that lane
# authors process markdown under .satelle/ with skills=["substrate"]. Sharing
# the [authored] step would dispatch that rubric on a docs story (sty_a085eb50).
obligations = ["raised", "doc-authored", "docs-verified"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }

[substrate]
obligations = ["raised", "authored", "substrate-verified"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }

[execution]
obligations = ["raised", "run", "run-verified"]
cancel = { state = "cancelled" }

[task]
obligations = ["raised", "run", "run-verified"]
cancel = { state = "cancelled" }
