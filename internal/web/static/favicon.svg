<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="satelle">
  <!-- ◐ monogram, animated: half-shaded sphere with a sweeping terminator
       (moon-phase cycle). Pure SMIL, no JS; browsers that don't animate
       favicons show the first frame, and prefers-reduced-motion users get
       the static ◐. Brand green hardcoded — favicons have no text colour
       to inherit. -->
  <style>
    #static { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #anim { display: none; }
      #static { display: block; }
    }
  </style>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#2f6f4f" stroke-width="3"/>
  <path id="anim" fill="#2f6f4f" d="M50 11 C-2 11 -2 89 50 89 C50 89 50 11 50 11 Z">
    <animate attributeName="d" dur="12s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.25;0.2501;0.5;0.75;1"
      values="M50 11 C-2 11 -2 89 50 89 C50 89 50 11 50 11 Z;
              M50 11 C-2 11 -2 89 50 89 C-2 89 -2 11 50 11 Z;
              M50 11 C102 11 102 89 50 89 C102 89 102 11 50 11 Z;
              M50 11 C50 11 50 89 50 89 C102 89 102 11 50 11 Z;
              M50 11 C-2 11 -2 89 50 89 C102 89 102 11 50 11 Z;
              M50 11 C-2 11 -2 89 50 89 C50 89 50 11 50 11 Z"/>
  </path>
  <path id="static" fill="#2f6f4f" d="M50 11 A39 39 0 0 0 50 89 Z"/>
</svg>
