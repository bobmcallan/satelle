name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history AND tags. cmd/satelle-serve/servepaths_test.go drives
          # the real serve-version gate, which compares against the latest
          # serve-v* tag and reads `.version` out of that tag's tree. The default
          # shallow, tagless checkout leaves the gate with no baseline, so it
          # exits early and every assertion about it passes for the wrong reason
          # (sty_a8853e85 — observed: a planted serve source file "passed").
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: unit tests
        run: go test ./...
      - name: no-cgo static build
        # Cover every main under cmd/ (CLI + satelle-serve; sty_19ff03f4).
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/...
      # Integration + browser e2e tests (tests/, -tags integration) run LOCALLY
      # via `make integration` — they need a real Chrome and exercise the running
      # binary, so they are not part of GitHub CI by design.
