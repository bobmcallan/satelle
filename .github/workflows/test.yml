name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history AND tags. cmd/satelled/servepaths_test.go drives
          # the real serve-version gate, which compares against the latest
          # serve-v* tag and reads `.version` out of that tag's tree. The default
          # shallow, tagless checkout leaves the gate with no baseline, so it
          # exits early and every assertion about it passes for the wrong reason
          # (sty_a8853e85 — observed: a planted serve source file "passed").
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: unit tests (strict)
        # STRICT=1: -count=3 -shuffle=on, and a skip that is not on
        # scripts/skip-allow.txt fails the run (sty_53c3f311).
        run: make test STRICT=1
      - name: locate Chrome
        # The browser e2e tests read SATELLE_CHROME; hermetic.sh forwards it.
        # They are not on the allowed-skip list, so a missing Chrome fails.
        run: |
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$chrome" ]; then echo "::error::no Chrome/Chromium on the runner"; exit 1; fi
          echo "SATELLE_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: integration tests (strict)
        run: make integration STRICT=1
      - name: no-cgo static build
        # Cover every main under cmd/ (CLI + satelled; sty_19ff03f4).
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/...
