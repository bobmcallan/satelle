version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/bobmcallan/satelle/internal/hosted/boardpb
inputs:
  - directory: api
    paths:
      - api/board.proto
plugins:
  - local: protoc-gen-go
    out: internal/hosted/boardpb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/hosted/boardpb
    opt: paths=source_relative
