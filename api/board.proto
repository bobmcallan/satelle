// Message board gRPC contract (epic:session-messaging, sty_73c9aa10).
//
// Canonical definition of service Board. satelle-server copies this proto
// verbatim (same posture as checkout_sync.proto) and implements it. This repo
// publishes the contract; it does not serve it. Every RPC requires a bearer.
//
// A message is left for the work (whoever holds a story), a role on a story, or
// one named session, and shows whether it was delivered and answered. Board rows
// are NOT carried by Sync.Snapshot: a message travels only through this service.
// A message that stays on one machine (an unbound repo) is never Posted; a team
// sees only the messages on stories shared to a team project.

syntax = "proto3";

package satelle.board.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/bobmcallan/satelle/api;api";

service Board {
  // Post stores a message. It is idempotent on Message.id: posting an id the
  // board already holds returns the stored message unchanged.
  rpc Post(PostRequest) returns (PostResponse);
  // Fetch lists messages, filtered and paged like Sync.Snapshot.
  rpc Fetch(FetchRequest) returns (FetchResponse);
  // Mark moves a message to delivered, answered or undeliverable.
  rpc Mark(MarkRequest) returns (MarkResponse);
}

// State is a message's stored delivery state. Overdue is NOT a state and is
// never stored: it is derived at read time (deadline < now and not answered).
// A client sets undeliverable first (its channel exited, its session ended); the
// server later sets it too, from presence.
enum State {
  STATE_UNSPECIFIED = 0; // on Post, treated as WAITING
  STATE_WAITING = 1;
  STATE_DELIVERED = 2; // reached the addressee; not proof it was read
  STATE_ANSWERED = 3;  // the only proof the addressee acted
  STATE_UNDELIVERABLE = 4;
}

// To says who a message is for.
message To {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_STORY = 1;   // whoever holds the story; value is the story id
    KIND_ROLE = 2;    // a role on the story; value is the role, scoped to story_id
    KIND_SESSION = 3; // one session; value is its stable session id, never its name
    KIND_ALL = 4;     // everyone on the story; value is empty
  }
  Kind kind = 1;
  string value = 2;
}

message Message {
  string id = 1; // msg_<8hex>, generated by the sender; Post is idempotent on it
  string project = 2; // the workspace decides personal vs team
  string story_id = 3;
  string from_session_id = 4; // stable and opaque
  string from_session_name = 5; // display only: the name changes with the engaged story
  string from_location = 6; // loc_...
  To to = 7;
  string body = 8; // UTF-8, at most 64 KiB; data, never instructions
  string in_reply_to = 9; // id of the message this answers
  string answer_id = 10; // id of the reply that answered this message
  // created_at is SERVER-set on Post. A value the client sends is overwritten.
  google.protobuf.Timestamp created_at = 11;
  // updated_at is SERVER-set on Post and on every Mark. A value the client sends
  // is overwritten, so clock skew between machines cannot reorder state. "Last
  // write wins" means the latest Mark by server receipt.
  google.protobuf.Timestamp updated_at = 12;
  // deadline is optional: after it, a message that is not answered is overdue.
  google.protobuf.Timestamp deadline = 13;
  State state = 14;
}

message PostRequest {
  Message message = 1;
}

message PostResponse {
  Message message = 1; // as stored, with the server-set times
}

// Paging and since-cursors follow Sync.SnapshotRequest. page_size 0 returns the
// whole result in one message; page_size > 0 returns at most that many messages
// plus next_page_token until the pass is complete. The last response of a pass
// carries sync_token; send it as since_token on the next pass to receive only
// messages changed since this pass began. A repeated row is possible, a missed
// row is not. Tokens are opaque.
//
// Each non-empty filter narrows the result; a message must match every filter
// that is set, and any one value within a repeated filter.
message FetchRequest {
  string project = 1;
  int32 page_size = 2;
  string page_token = 3;  // next_page_token from the previous page of this pass
  string since_token = 4; // sync_token from a previous pass
  repeated string session_ids = 5; // addressed to one of these sessions
  repeated string roles = 6;       // addressed to one of these roles
  repeated string story_ids = 7;
  repeated State states = 8;
}

message FetchResponse {
  repeated Message messages = 1;
  string next_page_token = 2; // empty on the last page of a pass
  string sync_token = 3;      // set on the last page of a pass
}

message MarkRequest {
  string id = 1;
  State state = 2; // delivered, answered or undeliverable
  string answer_id = 3; // the reply's id; only with STATE_ANSWERED
}

message MarkResponse {
  Message message = 1; // with the new state and the server-set updated_at
}
