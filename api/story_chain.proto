// Vendored verbatim from satelle-server api/story_chain.proto: the server owns
// this contract. Regenerate the Go client with `buf generate`. The CLI calls
// Append only.
//
// Story event-chain gRPC contract (satelle-server sty_8cd87197; the CLI half is
// satelle sty_9bdf08c4).
//
// Service Chain stores each story as an append-only chain of events. A client
// appends a story's new events together with the base event it last saw; the
// server accepts them only when that base is still the story's latest event
// (compare-and-append) and otherwise refuses with FAILED_PRECONDITION carrying a
// StaleBase detail. There are no holds, locks or checkouts on this service.
//
// The server checks only the envelope: an event is well formed, belongs to the
// story and builds on the latest. It never interprets a payload, a workflow or a
// status. The payload is the opaque CLI JSON object, like the record fields of
// satelle.sync.v1.
//
// Chain is a separate package from satelle.sync.v1 so the CLI and the server
// release independently; Sync's Apply and Snapshot are unchanged. Every RPC
// requires a bearer, refuses agent tokens, and fences the project like Sync.

syntax = "proto3";

package satelle.chain.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/bobmcallan/satelle/api;api";

service Chain {
  // Append stores the events when base_id is the story's latest event id (empty
  // means the story has no events). A stale base stores nothing and returns
  // FAILED_PRECONDITION with a StaleBase detail. ABORTED is not used.
  //
  // A retry of an Append that already applied has a stale base too; the refusal's
  // missing events then contain the retried ids, so the client sees its own
  // write landed.
  rpc Append(AppendRequest) returns (AppendResponse);
  // Read returns a story's events in chain order: all of them, or those after
  // after_id. An unknown after_id is NOT_FOUND.
  rpc Read(ReadRequest) returns (ReadResponse);
  // Subscribe streams every event appended to any story of the project after
  // the subscription starts, in per-story chain order. resume maps a story id to
  // the event id the client last saw; that story's later events are replayed
  // first.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

// Event is one link of a story's chain. id, story_id, base_id, workflow_version
// and payload are the client's; seq and appended_at are assigned by the server
// and ignored on Append.
message Event {
  // Client-chosen, unique within the story.
  string id = 1;
  string story_id = 2;
  // The event this one builds on; empty only for a story's first event.
  string base_id = 3;
  // The workflow version the event was made under.
  string workflow_version = 4;
  // Opaque UTF-8 JSON object.
  bytes payload = 5;
  // Position in the story's chain, from 1.
  int64 seq = 6;
  google.protobuf.Timestamp appended_at = 7;
}

message AppendRequest {
  string project = 1;
  string story_id = 2;
  // The latest event id the client saw; empty when it saw none.
  string base_id = 3;
  // Chained in order: the first builds on base_id, each next on the one before.
  repeated Event events = 4;
}

message AppendResponse {
  // The new latest event id.
  string latest_id = 1;
  // The stored events, with seq and appended_at.
  repeated Event appended = 2;
}

// StaleBase is the FAILED_PRECONDITION detail of a refused Append.
message StaleBase {
  string latest_id = 1;
  // The first events after the client's base, in chain order (from the start of
  // the chain when the base is empty or not in the chain). Bounded so the whole
  // detail stays within 1 KiB: a short chain returns every missing event, a long
  // one a prefix. When len(missing) < missing_count the client reads the rest
  // with Read.
  repeated Event missing = 2;
  // How many events follow the client's base in all, whether or not missing
  // carries them.
  int64 missing_count = 3;
}

message ReadRequest {
  string project = 1;
  string story_id = 2;
  // Empty reads the whole chain.
  string after_id = 3;
}

message ReadResponse {
  repeated Event events = 1;
  string latest_id = 2;
}

message SubscribeRequest {
  string project = 1;
  // story id -> the event id the client last saw for it.
  map<string, string> resume = 2;
}

message SubscribeResponse {
  Event event = 1;
}
