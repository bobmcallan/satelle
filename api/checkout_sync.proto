// Checkout-sync gRPC contract (epic:checkout-sync, sty_7ece3dc3).
//
// Canonical definition of service Sync. satelle-server copies this proto
// verbatim (same posture as testdata/openapi.yaml) and implements it. This
// repo publishes the contract; it does not implement the server.
//
// Subscribe is deliberately out of scope (a later story). Do not add it here.
// There is no gRPC login — OAuth stays on HTTP /oauth/*.
//
// record fields carry UTF-8 JSON (the opaque CLI work-item / ledger payload);
// the server may promote fields from them, matching REST json.RawMessage.

syntax = "proto3";

package satelle.sync.v1;

option go_package = "github.com/bobmcallan/satelle/api;api";

service Sync {
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
}

message ApplyRequest {
  string project = 1;
  repeated WorkItem items = 2;
  repeated LedgerEntry ledger = 3;
}

message ApplyResponse {
  int32 items = 1;
  int32 ledger = 2;
}

message SnapshotRequest {
  string project = 1;
  string kind = 2; // optional filter (story|execution)
}

message SnapshotResponse {
  repeated WorkItem items = 1;
  repeated LedgerEntry ledger = 2;
}

message WorkItem {
  string id = 1;
  string kind = 2;
  string type = 3;
  string status = 4;
  string title = 5;
  string origin = 6;
  bytes record = 7;
}

message LedgerEntry {
  string id = 1;
  string story_id = 2;
  string kind = 3;
  string type = 4;
  string origin = 5;
  bytes record = 6;
}
